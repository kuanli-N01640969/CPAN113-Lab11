<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lab11-API Calls</h1>
    
    <section>
        <button id="fetchBtn">Fetch data with fetch()</button>
        <button id="xhrBtn">Fetch data with XHR</button>
    </section>

    <section>
        <h2>Fetch Repsonse</h2>
        <div id="output">
            <p>Results will appear here.</p>
        </div>
    </section>
    
    <h3>Create a Post</h3>
    <form id="postForm">
        <input type="text" id="postTitle" placeholder="Title" required>
        <textarea id="postBody" placeholder="Body" required></textarea>
        <button type="submit">Send POST</button>
    </form>
    <div id="postMessage"></div>
    <script src="script.js"></script>
</body>
</html>
